<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>JeffAI</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="/config.js"></script>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f5f7fb;
    color: #111827;
    min-height: 100vh;
}

header {
    height: 65px;
    background: white;
    border-bottom: 1px solid #e5e7eb;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 25px;
    position: sticky;
    top: 0;
    z-index: 10;
}

.logo {
    font-size: 25px;
    font-weight: bold;
}

.logo span {
    color: #4f46e5;
}

.user-area {
    display: flex;
    align-items: center;
    gap: 15px;
}

#userEmail {
    color: #6b7280;
    font-size: 14px;
}

.logout {
    border: 0;
    background: #ef4444;
    color: white;
    padding: 9px 14px;
    border-radius: 8px;
    cursor: pointer;
}

main {
    max-width: 900px;
    margin: auto;
    padding: 30px 20px 120px;
}

.welcome {
    text-align: center;
    margin: 70px 0 35px;
}

.welcome h1 {
    font-size: 42px;
    margin-bottom: 12px;
}

.welcome p {
    color: #6b7280;
}

#chat {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.message {
    padding: 14px 17px;
    border-radius: 16px;
    max-width: 80%;
    line-height: 1.6;
    white-space: pre-wrap;
}

.user {
    align-self: flex-end;
    background: #4f46e5;
    color: white;
}

.assistant {
    align-self: flex-start;
    background: white;
    border: 1px solid #e5e7eb;
}

.input-area {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: white;
    border-top: 1px solid #e5e7eb;
    padding: 15px;
}

.input-box {
    max-width: 900px;
    margin: auto;
    display: flex;
    gap: 10px;
}

input {
    flex: 1;
    padding: 15px;
    border: 1px solid #d1d5db;
    border-radius: 12px;
    font-size: 16px;
    outline: none;
}

button.send {
    border: 0;
    background: #4f46e5;
    color: white;
    padding: 0 22px;
    border-radius: 12px;
    font-size: 16px;
    cursor: pointer;
}

button.send:hover {
    background: #4338ca;
}

.typing {
    opacity: .6;
}

@media(max-width:600px) {

    header {
        padding: 0 15px;
    }

    #userEmail {
        display: none;
    }

    main {
        padding-left: 12px;
        padding-right: 12px;
    }

    .welcome {
        margin-top: 45px;
    }

    .welcome h1 {
        font-size: 32px;
    }

    .message {
        max-width: 92%;
    }

    button.send {
        padding: 0 16px;
    }

}

</style>

</head>

<body>

<header>

<div class="logo">
Jeff<span>AI</span>
</div>

<div class="user-area">

<span id="userEmail"></span>

<button
    class="logout"
    id="logoutButton"
>
Logout
</button>

</div>

</header>


<main>

<div class="welcome" id="welcome">

<h1>
How can I help?
</h1>

<p>
Welcome to JeffAI
</p>

</div>


<div id="chat"></div>

</main>


<div class="input-area">

<form
    class="input-box"
    id="chatForm"
>

<input
    id="messageInput"
    type="text"
    placeholder="Message JeffAI..."
    autocomplete="off"
>

<button
    class="send"
    type="submit"
>
Send
</button>

</form>

</div>


<script>

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


let currentConversation = null;


function addMessage(text, type) {

    const message =
        document.createElement("div");

    message.className =
        `message ${type}`;

    message.textContent = text;

    chat.appendChild(message);

    window.scrollTo({
        top: document.body.scrollHeight,
        behavior: "smooth"
    });

    return message;
}


async function checkUser() {

    const {
        data: {
            user
        }
    } = await supabaseClient.auth.getUser();

    if (!user) {

        window.location.href =
            "/login.html";

        return null;
    }

    document.getElementById(
        "userEmail"
    ).textContent = user.email;

    return user;
}


async function getToken() {

    const {
        data: {
            session
        }
    } = await supabaseClient.auth.getSession();

    if (!session) {

        window.location.href =
            "/login.html";

        return null;
    }

    return session.access_token;
}


async function createConversation() {

    const token = await getToken();

    if (!token) return null;

    const response = await fetch(
        "/api/conversations",
        {
            method: "POST",

            headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${token}`
            },

            body: JSON.stringify({
                title: "New conversation"
            })
        }
    );

    const data = await response.json();

    if (!data.success) {

        console.error(data.error);

        return null;
    }

    return data.conversation.id;
}


document
.getElementById("chatForm")
.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        const input =
            document.getElementById(
                "messageInput"
            );

        const message =
            input.value.trim();

        if (!message) return;

        document
        .getElementById("welcome")
        .style.display = "none";

        addMessage(
            message,
            "user"
        );

        input.value = "";

        const typing =
            addMessage(
                "JeffAI is thinking...",
                "assistant"
            );

        typing.classList.add("typing");

        try {

            const token =
                await getToken();

            if (!token) return;

            if (!currentConversation) {

                currentConversation =
                    await createConversation();
            }

            const response =
                await fetch(
                    "/api/chat",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json",
                            "Authorization": `Bearer ${token}`
                        },

                        body: JSON.stringify({
                            message,
                            conversation_id:
                                currentConversation
                        })
                    }
                );

            const data =
                await response.json();

            typing.remove();

            if (data.success) {

                currentConversation =
                    data.conversation_id;

                addMessage(
                    data.message,
                    "assistant"
                );

            } else {

                addMessage(
                    data.error ||
                    "Something went wrong.",
                    "assistant"
                );
            }

        } catch (error) {

            typing.remove();

            addMessage(
                "Unable to connect to JeffAI.",
                "assistant"
            );

            console.error(error);

        }

    }
);


document
.getElementById("logoutButton")
.addEventListener(
    "click",
    async function() {

        await supabaseClient.auth.signOut();

        window.location.href =
            "/login.html";

    }
);


checkUser();

</script>

</body>

</html>
