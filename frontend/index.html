<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="google-site-verification"
        content="eb67qjTC1iBlsAxhnmdO2b74oMuJ63wglxiSu1m6_6k"
    >

    >

    >

    <meta

    >

    <!-- Organization structured data -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "JeffAI",
        "alternateName": "Jeff AI",
        "url": "https://jeffai-pwit.onrender.com/",
        "description": "JeffAI is a personal AI assistant for learning, coding, research, writing, and document understanding."
    }

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- JeffAI configuration -->
    <script src="/config.js"></script>

    <style>
        /* =========================================================
           GLOBAL
        ========================================================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;
            overflow: hidden;
        }

        body {
            background: #ffffff;
            color: #202123;
            transition:
                background 0.2s ease,
                color 0.2s ease;
        }

        button,
        textarea,
        input {
            font-family: inherit;
        }

        button {
            -webkit-tap-highlight-color: transparent;
        }

        /* =========================================================
           APP
        ========================================================= */

        .app {
            display: flex;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        /* =========================================================
           SIDEBAR
        ========================================================= */

        .sidebar {
            width: 260px;
            height: 100%;
            background: #f7f7f8;
            color: #202123;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            border-right: 1px solid #e5e5e5;
            transition:
                transform 0.25s ease,
                background 0.2s ease;
            z-index: 1000;
        }

        .sidebar-header {
            padding: 14px 12px 10px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 8px 14px;
        }

        .brand-logo {
            width: 32px;
            height: 32px;
            border-radius: 9px;
            background: #111111;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 16px;
            flex-shrink: 0;
        }

        .brand-name {
            font-size: 17px;
            font-weight: 700;
            letter-spacing: -0.2px;
        }

        .new-chat {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 9px;
            border: 1px solid #d9d9d9;
            background: #ffffff;
            color: #202123;
            padding: 10px 12px;
            border-radius: 9px;
            cursor: pointer;
            text-align: left;
            font-size: 13px;
            transition:
                background 0.15s ease,
                border-color 0.15s ease;
        }

        .new-chat:hover {
            background: #eeeeee;
            border-color: #cccccc;
        }

        .conversation-title {
            color: #777777;
            font-size: 11px;
            font-weight: 600;
            padding: 15px 18px 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .conversations {
            flex: 1;
            overflow-y: auto;
            padding: 0 8px 8px;
            scrollbar-width: thin;
        }

        .conversation {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 9px 10px;
            margin-bottom: 2px;
            border-radius: 8px;
            cursor: pointer;
            color: #3f3f46;
            font-size: 13px;
            transition: background 0.15s ease;
        }

        .conversation:hover {
            background: #e9e9ea;
        }

        .conversation.active {
            background: #e3e3e5;
            color: #111111;
        }

        .conversation-name {
            flex: 1;
            min-width: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .delete-conversation {
            opacity: 0;
            border: none;
            background: transparent;
            color: #888888;
            cursor: pointer;
            font-size: 13px;
            padding: 2px 4px;
            border-radius: 5px;
            transition:
                opacity 0.15s ease,
                background 0.15s ease,
                color 0.15s ease;
        }

        .conversation:hover .delete-conversation {
            opacity: 1;
        }

        .delete-conversation:hover {
            color: #d93025;
            background: rgba(217, 48, 37, 0.08);
        }

        /* =========================================================
           SIDEBAR FOOTER
        ========================================================= */

        .sidebar-footer {
            padding: 10px;
            border-top: 1px solid #e5e5e5;
        }

        .user-box {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 8px;
            border-radius: 9px;
        }

        .user-box:hover {
            background: #eeeeee;
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #111111;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 13px;
            flex-shrink: 0;
        }

        .user-info {
            flex: 1;
            min-width: 0;
        }

        .user-email {
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #444444;
        }

        .logout-button {
            border: none;
            background: transparent;
            color: #777777;
            cursor: pointer;
            font-size: 11px;
            margin-top: 3px;
            padding: 0;
        }

        .logout-button:hover {
            color: #111111;
        }

        /* =========================================================
           MAIN
        ========================================================= */

        .main {
            flex: 1;
            height: 100%;
            min-width: 0;
            display: flex;
            flex-direction: column;
            background: #ffffff;
            position: relative;
        }

        /* =========================================================
           TOPBAR
        ========================================================= */

        .topbar {
            height: 58px;
            border-bottom: 1px solid #eeeeee;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 18px;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 20;
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        .mobile-menu {
            display: none;
            width: 36px;
            height: 36px;
            border: none;
            background: transparent;
            border-radius: 8px;
            font-size: 21px;
            cursor: pointer;
        }

        .mobile-menu:hover {
            background: #f1f1f1;
        }

        .top-title {
            max-width: 300px;
            font-size: 15px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .download-app {
            display: flex;
            align-items: center;
            text-decoration: none;
            border: 1px solid #dedede;
            background: #ffffff;
            color: #202123;
            padding: 7px 11px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            margin-left: auto;
            margin-right: 8px;
            transition:
                background 0.15s ease,
                border-color 0.15s ease;
        }

        .download-app:hover {
            background: #f5f5f5;
            border-color: #cccccc;
        }

        .theme-button {
            width: 36px;
            height: 36px;
            border: 1px solid #dedede;
            border-radius: 9px;
            background: #ffffff;
            cursor: pointer;
            font-size: 17px;
            transition:
                background 0.15s ease,
                border-color 0.15s ease;
        }

        .theme-button:hover {
            background: #f5f5f5;
        }

        /* =========================================================
           CHAT AREA
        ========================================================= */

        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 28px 20px 180px;
            scroll-behavior: smooth;
        }

        .messages {
            max-width: 760px;
            margin: 0 auto;
        }

        /* =========================================================
           WELCOME
        ========================================================= */

        .welcome {
            min-height: 58vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 30px 20px;
        }

        .welcome-logo {
            width: 60px;
            height: 60px;
            border-radius: 18px;
            background: #111111;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 26px;
            margin-bottom: 20px;
            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.12);
        }

        .welcome h1 {
            font-size: 28px;
            font-weight: 600;
            letter-spacing: -0.6px;
            margin-bottom: 10px;
            color: #202123;
        }

        .welcome p {
            color: #777777;
            font-size: 14px;
            max-width: 520px;
            line-height: 1.65;
        }

        /* =========================================================
           MESSAGE LAYOUT
        ========================================================= */

        .message {
            display: flex;
            width: 100%;
            margin-bottom: 30px;
            line-height: 1.65;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.assistant {
            justify-content: flex-start;
        }

        .message-content {
            max-width: 78%;
            min-width: 0;
        }

        .message-avatar {
            display: none;
        }

        .message-role {
            font-size: 11px;
            font-weight: 600;
            margin-bottom: 5px;
            color: #777777;
        }

        .message.user .message-content {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .message.user .message-role {
            text-align: right;
        }

        .message.assistant .message-role {
            text-align: left;
        }

        .message-text {
            white-space: pre-wrap;
            word-wrap: break-word;
            overflow-wrap: break-word;
            font-size: 14px;
        }

        /* =========================================================
           USER MESSAGE
        ========================================================= */

        .message.user .message-text {
            background: #f1f1f1;
            color: #202123;
            padding: 10px 15px;
            border-radius: 17px 17px 4px 17px;
        }

        /* =========================================================
           ASSISTANT MESSAGE
        ========================================================= */

        .message.assistant .message-text {
            background: transparent;
            color: #202123;
            padding: 0;
            border-radius: 0;
        }

        /* =========================================================
           INPUT AREA
        ========================================================= */

        .input-area {
            position: fixed;
            left: 260px;
            right: 0;
            bottom: 0;
            background:
                linear-gradient(
                    to top,
                    #ffffff 68%,
                    rgba(255, 255, 255, 0)
                );
            padding: 18px 20px 20px;
            z-index: 30;
        }

        .document-tools {
            max-width: 760px;
            margin: 0 auto 8px;
            display: flex;
            align-items: center;
            gap: 8px;
            min-height: 30px;
        }

        .upload-button {
            display: inline-flex;
            align-items: center;
            border: 1px solid #dedede;
            background: #ffffff;
            color: #444444;
            padding: 7px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 11px;
            transition:
                background 0.15s ease,
                border-color 0.15s ease;
        }

        .upload-button:hover {
            background: #f5f5f5;
            border-color: #cccccc;
        }

        #uploadStatus {
            font-size: 11px;
            color: #777777;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .input-container {
            max-width: 760px;
            margin: 0 auto;
            display: flex;
            align-items: flex-end;
            gap: 8px;
            border: 1px solid #d9d9d9;
            border-radius: 17px;
            padding: 9px 9px 9px 15px;
            background: #ffffff;
            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.08);
            transition:
                border-color 0.15s ease,
                box-shadow 0.15s ease;
        }

        .input-container:focus-within {
            border-color: #bdbdbd;
            box-shadow:
                0 6px 24px rgba(0, 0, 0, 0.1);
        }

        #messageInput {
            flex: 1;
            border: none;
            outline: none;
            resize: none;
            max-height: 180px;
            min-height: 24px;
            font-family: inherit;
            font-size: 14px;
            line-height: 1.5;
            padding: 5px 0;
            background: transparent;
            color: #202123;
        }

        #messageInput::placeholder {
            color: #999999;
        }

        .send-button {
            width: 36px;
            height: 36px;
            border: none;
            border-radius: 10px;
            background: #111111;
            color: #ffffff;
            cursor: pointer;
            font-size: 17px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition:
                background 0.15s ease,
                opacity 0.15s ease,
                transform 0.1s ease;
        }

        .send-button:hover {
            background: #333333;
        }

        .send-button:active {
            transform: scale(0.95);
        }

        .send-button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .input-hint {
            max-width: 760px;
            margin: 7px auto 0;
            text-align: center;
            color: #999999;
            font-size: 10px;
        }

        /* =========================================================
           TYPING INDICATOR
        ========================================================= */

        .typing {
            display: flex;
            align-items: center;
            gap: 4px;
            padding-top: 7px;
        }

        .typing span {
            width: 6px;
            height: 6px;
            background: #999999;
            border-radius: 50%;
            animation: typing 1.2s infinite;
        }

        .typing span:nth-child(2) {
            animation-delay: 0.15s;
        }

        .typing span:nth-child(3) {
            animation-delay: 0.3s;
        }

        @keyframes typing {
            0%,
            60%,
            100% {
                transform: translateY(0);
                opacity: 0.4;
            }

            30% {
                transform: translateY(-4px);
                opacity: 1;
            }
        }

        /* =========================================================
           DARK MODE
        ========================================================= */

        body.dark {
            background: #212121;
            color: #eeeeee;
        }

        body.dark .sidebar {
            background: #171717;
            color: #ffffff;
            border-right-color: #2f2f2f;
        }

        body.dark .brand-logo {
            background: #ffffff;
            color: #111111;
        }

        body.dark .new-chat {
            background: #212121;
            border-color: #3f3f3f;
            color: #ffffff;
        }

        body.dark .new-chat:hover {
            background: #2a2a2a;
            border-color: #4b4b4b;
        }

        body.dark .conversation-title {
            color: #8e8e8e;
        }

        body.dark .conversation {
            color: #dddddd;
        }

        body.dark .conversation:hover {
            background: #2a2a2a;
        }

        body.dark .conversation.active {
            background: #303030;
            color: #ffffff;
        }

        body.dark .sidebar-footer {
            border-top-color: #2f2f2f;
        }

        body.dark .user-box:hover {
            background: #242424;
        }

        body.dark .avatar {
            background: #ffffff;
            color: #111111;
        }

        body.dark .user-email {
            color: #dddddd;
        }

        body.dark .logout-button {
            color: #999999;
        }

        body.dark .logout-button:hover {
            color: #ffffff;
        }

        body.dark .main {
            background: #212121;
        }

        body.dark .topbar {
            background: rgba(33, 33, 33, 0.92);
            border-color: #303030;
            color: #ffffff;
        }

        body.dark .mobile-menu {
            color: #ffffff;
        }

        body.dark .mobile-menu:hover {
            background: #2a2a2a;
        }

        body.dark .download-app {
            background: #242424;
            border-color: #444444;
            color: #ffffff;
        }

        body.dark .download-app:hover {
            background: #303030;
        }

        body.dark .theme-button {
            background: #242424;
            border-color: #444444;
            color: #ffffff;
        }

        body.dark .theme-button:hover {
            background: #303030;
        }

        body.dark .welcome-logo {
            background: #ffffff;
            color: #111111;
        }

        body.dark .welcome h1 {
            color: #eeeeee;
        }

        body.dark .welcome p {
            color: #aaaaaa;
        }

        body.dark .message-role {
            color: #999999;
        }

        body.dark .message.user .message-text {
            background: #303030;
            color: #ffffff;
        }

        body.dark .message.assistant .message-text {
            background: transparent;
            color: #eeeeee;
        }

        body.dark .input-area {
            background:
                linear-gradient(
                    to top,
                    #212121 68%,
                    rgba(33, 33, 33, 0)
                );
        }

        body.dark .upload-button {
            background: #242424;
            border-color: #444444;
            color: #dddddd;
        }

        body.dark .upload-button:hover {
            background: #303030;
        }

        body.dark #uploadStatus {
            color: #999999;
        }

        body.dark .input-container {
            background: #2f2f2f;
            border-color: #4a4a4a;
            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.25);
        }

        body.dark .input-container:focus-within {
            border-color: #5a5a5a;
            box-shadow:
                0 6px 24px rgba(0, 0, 0, 0.3);
        }

        body.dark #messageInput {
            color: #ffffff;
        }

        body.dark #messageInput::placeholder {
            color: #888888;
        }

        body.dark .send-button {
            background: #ffffff;
            color: #111111;
        }

        body.dark .send-button:hover {
            background: #dddddd;
        }

        body.dark .input-hint {
            color: #777777;
        }

        /* =========================================================
           MOBILE
        ========================================================= */

        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                left: 0;
                top: 0;
                bottom: 0;
                width: 280px;
                transform: translateX(-100%);
                box-shadow:
                    8px 0 30px rgba(0, 0, 0, 0.18);
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .mobile-menu {
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .topbar {
                padding: 0 12px;
            }

            .download-app {
                font-size: 10px;
                padding: 6px 8px;
                margin-right: 6px;
            }

            .theme-button {
                width: 34px;
                height: 34px;
            }

            .top-title {
                max-width: 140px;
            }

            .chat-area {
                padding: 20px 14px 160px;
            }

            .messages {
                max-width: 100%;
            }

            .message {
                margin-bottom: 25px;
            }

            .message-content {
                max-width: 88%;
            }

            .message-text {
                font-size: 14px;
            }

            .welcome {
                min-height: 55vh;
                padding: 20px 12px;
            }

            .welcome-logo {
                width: 54px;
                height: 54px;
                border-radius: 16px;
                font-size: 23px;
            }

            .welcome h1 {
                font-size: 24px;
                letter-spacing: -0.4px;
            }

            .welcome p {
                font-size: 13px;
                max-width: 330px;
            }

            .input-area {
                left: 0;
                padding: 10px 10px 12px;
                padding-top: 18px;
            }

            .document-tools {
                padding: 0 3px;
            }

            .input-container {
                border-radius: 16px;
                padding-left: 13px;
            }

            .input-hint {
                display: none;
            }

            #messageInput {
                font-size: 14px;
            }

            .send-button {
                width: 35px;
                height: 35px;
            }
        }

        @media (max-width: 420px) {
            .download-app {
                display: none;
            }

            .top-title {
                max-width: 180px;
            }

            .message-content {
                max-width: 92%;
            }

            .welcome h1 {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

    <div class="app">

        <!-- =====================================================
             SIDEBAR
        ====================================================== -->

        <aside
            class="sidebar"
            id="sidebar"
        >

            <div class="sidebar-header">

                <div class="brand">
                    <div class="brand-logo">J</div>

                    <div class="brand-name">
                        JeffAI
                    </div>
                </div>

                <button
                    class="new-chat"
                    onclick="newChat()"
                >
                    + New chat
                </button>

            </div>

            <div class="conversation-title">
                Conversations
            </div>

            <div
                class="conversations"
                id="conversationList"
            >
                <div
                    style="
                        color: #777;
                        font-size: 12px;
                        padding: 12px;
                    "
                >
                    Loading...
                </div>
            </div>

            <div class="sidebar-footer">

                <div class="user-box">

                    <div
                        class="avatar"
                        id="userAvatar"
                    >
                        J
                    </div>

                    <div class="user-info">

                        <div
                            class="user-email"
                            id="userEmail"
                        >
                            Loading...
                        </div>

                        <button
                            class="logout-button"
                            onclick="logout()"
                        >
                            Log out
                        </button>

                    </div>

                </div>

            </div>

        </aside>

        <!-- =====================================================
             MAIN
        ====================================================== -->

        <main class="main">

            <!-- TOPBAR -->

            <header class="topbar">

                <div class="topbar-left">

                    <button
                        class="mobile-menu"
                        onclick="toggleSidebar()"
                        aria-label="Open menu"
                    >
                        ☰
                    </button>

                    <div
                        class="top-title"
                        id="topTitle"
                    >
                        JeffAI
                    </div>

                </div>

                <a
                    href="/downloads/JeffAI.apk"
                    class="download-app"
                    download
                >
                    📱 Download App
                </a>

                <button
                    class="theme-button"
                    id="themeButton"
                    onclick="toggleTheme()"
                    title="Toggle theme"
                    aria-label="Toggle theme"
                >
                    🌙
                </button>

            </header>

            <!-- =================================================
                 CHAT
            ================================================== -->

            <section
                class="chat-area"
                id="chatArea"
            >

                <div
                    class="messages"
                    id="messages"
                >

                    <div
                        class="welcome"
                        id="welcome"
                    >

                        <div class="welcome-logo">
                            J
                        </div>

                        <h1>
                            How can I help you?
                        </h1>

                        <p>
                            I'm JeffAI, your personal AI assistant.
                            Ask me questions, learn something new,
                            write, code, research, or upload a document
                            for me to help you understand.
                        </p>

                    </div>

                </div>

            </section>

            <!-- =================================================
                 INPUT
            ================================================== -->

            <div class="input-area">

                <!-- DOCUMENT UPLOAD -->

                <div class="document-tools">

                    <input
                        type="file"
                        id="documentInput"
                        accept=".pdf,.docx,.txt"
                        hidden
                    >

                    <button
                        type="button"
                        class="upload-button"
                        onclick="
                            document
                                .getElementById('documentInput')
                                .click()
                        "
                    >
                        📎 Upload document
                    </button>

                    <span id="uploadStatus"></span>

                </div>

                <!-- CHAT FORM -->

                <form
                    class="input-container"
                    id="chatForm"
                >

                    <textarea
                        id="messageInput"
                        rows="1"
                        placeholder="Message JeffAI..."
                        autocomplete="off"
                    ></textarea>

                    <button
                        type="submit"
                        class="send-button"
                        id="sendButton"
                        aria-label="Send message"
                    >
                        ↑
                    </button>

                </form>

                <div class="input-hint">
                    Enter to send • Shift + Enter for a new line
                </div>

            </div>

        </main>

    </div>

    <script>
        /* =========================================================
           SUPABASE
        ========================================================= */

        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_ANON_KEY
            );

        /* =========================================================
           GLOBAL VARIABLES
        ========================================================= */

        let currentConversationId = null;

        /* =========================================================
           GET USER
        ========================================================= */

        async function getUser() {
            const {
                data,
                error
            } = await supabaseClient.auth.getUser();

            if (
                error ||
                !data.user
            ) {
                window.location.href = "/login.html";
                return null;
            }

            return data.user;
        }

        /* =========================================================
           GET TOKEN
        ========================================================= */

        async function getToken() {
            const {
                data,
                error
            } = await supabaseClient.auth.getSession();

            if (
                error ||
                !data.session
            ) {
                throw new Error(
                    "You are not logged in."
                );
            }

            return data.session.access_token;
        }

        /* =========================================================
           USER INFO
        ========================================================= */

        async function loadUser() {
            const user = await getUser();

            if (!user) {
                return;
            }

            const email =
                user.email || "User";

            document
                .getElementById("userEmail")
                .textContent = email;

            const firstLetter =
                email
                    .charAt(0)
                    .toUpperCase();

            document
                .getElementById("userAvatar")
                .textContent = firstLetter;
        }

        /* =========================================================
           LOAD CONVERSATIONS
        ========================================================= */

        async function loadConversations() {
            try {
                const token =
                    await getToken();

                const response =
                    await fetch(
                        "/api/conversations",
                        {
                            headers: {
                                "Authorization":
                                    `Bearer ${token}`
                            }
                        }
                    );

                const data =
                    await response.json();

                const list =
                    document.getElementById(
                        "conversationList"
                    );

                if (!data.success) {
                    list.innerHTML = `
                        <div
                            style="
                                color:#777;
                                font-size:12px;
                                padding:12px;
                            "
                        >
                            Unable to load chats.
                        </div>
                    `;

                    return;
                }

                if (
                    !data.conversations ||
                    data.conversations.length === 0
                ) {
                    list.innerHTML = `
                        <div
                            style="
                                color:#777;
                                font-size:12px;
                                padding:12px;
                            "
                        >
                            No conversations yet.
                        </div>
                    `;

                    return;
                }

                list.innerHTML = "";

                data.conversations.forEach(
                    conversation => {

                        const item =
                            document.createElement(
                                "div"
                            );

                        item.className =
                            "conversation";

                        if (
                            conversation.id ===
                            currentConversationId
                        ) {
                            item.classList.add(
                                "active"
                            );
                        }

                        const name =
                            document.createElement(
                                "div"
                            );

                        name.className =
                            "conversation-name";

                        name.textContent =
                            conversation.title ||
                            "New conversation";

                        const deleteButton =
                            document.createElement(
                                "button"
                            );

                        deleteButton.className =
                            "delete-conversation";

                        deleteButton.textContent =
                            "✕";

                        deleteButton.title =
                            "Delete conversation";

                        deleteButton.onclick =
                            async function(event) {
                                event.stopPropagation();

                                await deleteConversation(
                                    conversation.id
                                );
                            };

                        item.appendChild(name);

                        item.appendChild(
                            deleteButton
                        );

                        item.onclick =
                            function() {
                                openConversation(
                                    conversation.id,
                                    conversation.title
                                );
                            };

                        list.appendChild(item);
                    }
                );

            } catch (error) {
                console.error(
                    "Conversation error:",
                    error
                );
            }
        }

        /* =========================================================
           NEW CHAT
        ========================================================= */

        function newChat() {
            currentConversationId = null;

            document
                .getElementById("topTitle")
                .textContent = "JeffAI";

            const messages =
                document.getElementById(
                    "messages"
                );

            messages.innerHTML = `
                <div
                    class="welcome"
                    id="welcome"
                >
                    <div class="welcome-logo">
                        J
                    </div>

                    <h1>
                        How can I help you?
                    </h1>

                    <p>
                        I'm JeffAI, your personal AI assistant.
                        Ask me questions, learn something new,
                        write, code, research, or upload a document
                        for me to help you understand.
                    </p>
                </div>
            `;

            loadConversations();
            closeSidebar();
        }

        /* =========================================================
           CREATE CONVERSATION
        ========================================================= */

        async function createConversation(
            firstMessage
        ) {
            const token =
                await getToken();

            const response =
                await fetch(
                    "/api/conversations",
                    {
                        method: "POST",

                        headers: {
                            "Authorization":
                                `Bearer ${token}`,

                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({
                                title:
                                    firstMessage
                                        .trim()
                                        .slice(0, 50)
                            })
                    }
                );

            const data =
                await response.json();

            if (!data.success) {
                throw new Error(
                    data.error ||
                    "Could not create conversation."
                );
            }

            currentConversationId =
                data.conversation.id;

            return data.conversation;
        }

        /* =========================================================
           OPEN CONVERSATION
        ========================================================= */

        async function openConversation(
            conversationId,
            title
        ) {
            try {
                currentConversationId =
                    conversationId;

                document
                    .getElementById("topTitle")
                    .textContent =
                    title || "JeffAI";

                const token =
                    await getToken();

                const response =
                    await fetch(
                        `/api/conversations/${conversationId}/messages`,
                        {
                            headers: {
                                "Authorization":
                                    `Bearer ${token}`
                            }
                        }
                    );

                const data =
                    await response.json();

                if (!data.success) {
                    alert(
                        data.error ||
                        "Could not load conversation."
                    );

                    return;
                }

                const messages =
                    document.getElementById(
                        "messages"
                    );

                messages.innerHTML = "";

                if (
                    !data.messages ||
                    data.messages.length === 0
                ) {
                    showWelcome();
                } else {
                    data.messages.forEach(
                        message => {
                            addMessage(
                                message.role,
                                message.content
                            );
                        }
                    );
                }

                loadConversations();
                scrollToBottom();
                closeSidebar();

            } catch (error) {
                console.error(error);

                alert(
                    "Unable to load conversation."
                );
            }
        }

        /* =========================================================
           DELETE CONVERSATION
        ========================================================= */

        async function deleteConversation(
            conversationId
        ) {
            const confirmed =
                confirm(
                    "Delete this conversation?"
                );

            if (!confirmed) {
                return;
            }

            try {
                const token =
                    await getToken();

                const response =
                    await fetch(
                        `/api/conversations/${conversationId}`,
                        {
                            method: "DELETE",

                            headers: {
                                "Authorization":
                                    `Bearer ${token}`
                            }
                        }
                    );

                const data =
                    await response.json();

                if (!data.success) {
                    alert(
                        data.error ||
                        "Could not delete conversation."
                    );

                    return;
                }

                if (
                    conversationId ===
                    currentConversationId
                ) {
                    newChat();
                } else {
                    loadConversations();
                }

            } catch (error) {
                console.error(error);

                alert(
                    "Unable to delete conversation."
                );
            }
        }

        /* =========================================================
           SHOW WELCOME
        ========================================================= */

        function showWelcome() {
            document
                .getElementById("messages")
                .innerHTML = `
                    <div
                        class="welcome"
                        id="welcome"
                    >
                        <div class="welcome-logo">
                            J
                        </div>

                        <h1>
                            How can I help you?
                        </h1>

                        <p>
                            I'm JeffAI, your personal AI assistant.
                            Ask me questions, learn something new,
                            write, code, research, or upload a document
                            for me to help you understand.
                        </p>
                    </div>
                `;
        }

        /* =========================================================
           ADD MESSAGE
        ========================================================= */

        function addMessage(
            role,
            text
        ) {
            const welcome =
                document.getElementById(
                    "welcome"
                );

            if (welcome) {
                welcome.remove();
            }

            const messages =
                document.getElementById(
                    "messages"
                );

            const message =
                document.createElement(
                    "div"
                );

            message.className =
                `message ${role}`;

            const avatar =
                document.createElement(
                    "div"
                );

            avatar.className =
                "message-avatar";

            avatar.textContent =
                role === "user"
                    ? "You"
                    : "J";

            const content =
                document.createElement(
                    "div"
                );

            content.className =
                "message-content";

            const roleLabel =
                document.createElement(
                    "div"
                );

            roleLabel.className =
                "message-role";

            roleLabel.textContent =
                role === "user"
                    ? "You"
                    : "JeffAI";

            const textElement =
                document.createElement(
                    "div"
                );

            textElement.className =
                "message-text";

            textElement.textContent =
                text;

            content.appendChild(
                roleLabel
            );

            content.appendChild(
                textElement
            );

            message.appendChild(
                avatar
            );

            message.appendChild(
                content
            );

            messages.appendChild(
                message
            );

            scrollToBottom();
        }

        /* =========================================================
           TYPING INDICATOR
        ========================================================= */

        function showTyping() {
            const messages =
                document.getElementById(
                    "messages"
                );

            const typing =
                document.createElement(
                    "div"
                );

            typing.id =
                "typingMessage";

            typing.className =
                "message assistant";

            typing.innerHTML = `
                <div class="message-avatar">
                    J
                </div>

                <div class="message-content">

                    <div class="message-role">
                        JeffAI
                    </div>

                    <div class="typing">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>

                </div>
            `;

            messages.appendChild(
                typing
            );

            scrollToBottom();
        }

        /* =========================================================
           REMOVE TYPING
        ========================================================= */

        function removeTyping() {
            const typing =
                document.getElementById(
                    "typingMessage"
                );

            if (typing) {
                typing.remove();
            }
        }

        /* =========================================================
           SEND MESSAGE
        ========================================================= */

        document
            .getElementById("chatForm")
            .addEventListener(
                "submit",
                async function(event) {

                    event.preventDefault();

                    const input =
                        document.getElementById(
                            "messageInput"
                        );

                    const sendButton =
                        document.getElementById(
                            "sendButton"
                        );

                    const message =
                        input.value.trim();

                    if (!message) {
                        return;
                    }

                    input.value = "";
                    input.style.height = "auto";

                    /*
                     * Add the user's message
                     * immediately.
                     */

                    addMessage(
                        "user",
                        message
                    );

                    sendButton.disabled = true;

                    showTyping();

                    try {
                        const token =
                            await getToken();

                        /*
                         * Create a conversation
                         * if this is a new chat.
                         */

                        if (
                            !currentConversationId
                        ) {
                            const conversation =
                                await createConversation(
                                    message
                                );

                            currentConversationId =
                                conversation.id;

                            document
                                .getElementById(
                                    "topTitle"
                                )
                                .textContent =
                                conversation.title ||
                                "JeffAI";
                        }

                        const response =
                            await fetch(
                                "/api/chat",
                                {
                                    method: "POST",

                                    headers: {
                                        "Authorization":
                                            `Bearer ${token}`,

                                        "Content-Type":
                                            "application/json"
                                    },

                                    body:
                                        JSON.stringify({
                                            message:
                                                message,

                                            conversation_id:
                                                currentConversationId
                                        })
                                }
                            );

                        const data =
                            await response.json();

                        removeTyping();

                        if (!data.success) {
                            addMessage(
                                "assistant",
                                data.error ||
                                "Something went wrong."
                            );

                            return;
                        }

                        addMessage(
                            "assistant",
                            data.response
                        );

                        loadConversations();

                    } catch (error) {

                        console.error(
                            "Chat error:",
                            error
                        );

                        removeTyping();

                        addMessage(
                            "assistant",
                            "Sorry, I couldn't connect to the server. Please try again."
                        );

                    } finally {

                        sendButton.disabled = false;

                        input.focus();
                    }
                }
            );

        /* =========================================================
           ENTER TO SEND
        ========================================================= */

        document
            .getElementById("messageInput")
            .addEventListener(
                "keydown",
                function(event) {

                    if (
                        event.key === "Enter" &&
                        !event.shiftKey
                    ) {
                        event.preventDefault();

                        document
                            .getElementById(
                                "chatForm"
                            )
                            .requestSubmit();
                    }
                }
            );

        /* =========================================================
           AUTO RESIZE TEXTAREA
        ========================================================= */

        document
            .getElementById("messageInput")
            .addEventListener(
                "input",
                function() {

                    this.style.height = "auto";

                    this.style.height =
                        Math.min(
                            this.scrollHeight,
                            180
                        ) + "px";
                }
            );

        /* =========================================================
           DOCUMENT UPLOAD
        ========================================================= */

        document
            .getElementById("documentInput")
            .addEventListener(
                "change",
                async function() {

                    const file =
                        this.files[0];

                    if (!file) {
                        return;
                    }

                    const status =
                        document.getElementById(
                            "uploadStatus"
                        );

                    const allowedTypes = [
                        ".pdf",
                        ".docx",
                        ".txt"
                    ];

                    const filename =
                        file.name.toLowerCase();

                    const valid =
                        allowedTypes.some(
                            extension =>
                                filename.endsWith(
                                    extension
                                )
                        );

                    if (!valid) {
                        status.textContent =
                            "Only PDF, DOCX and TXT files are allowed.";

                        this.value = "";

                        return;
                    }

                    if (
                        file.size >
                        10 * 1024 * 1024
                    ) {
                        status.textContent =
                            "File is too large. Maximum size is 10 MB.";

                        this.value = "";

                        return;
                    }

                    status.textContent =
                        "Uploading...";

                    try {
                        const token =
                            await getToken();

                        const formData =
                            new FormData();

                        formData.append(
                            "file",
                            file
                        );

                        const response =
                            await fetch(
                                "/api/documents",
                                {
                                    method: "POST",

                                    headers: {
                                        "Authorization":
                                            `Bearer ${token}`
                                    },

                                    body:
                                        formData
                                }
                            );

                        const data =
                            await response.json();

                        if (!data.success) {
                            status.textContent =
                                data.error ||
                                "Upload failed.";

                            return;
                        }

                        status.textContent =
                            `✓ ${file.name} uploaded`;

                        setTimeout(
                            () => {
                                status.textContent =
                                    "";
                            },
                            5000
                        );

                    } catch (error) {

                        console.error(
                            "Upload error:",
                            error
                        );

                        status.textContent =
                            "Upload failed. Please try again.";

                    }

                    this.value = "";
                }
            );

        /* =========================================================
           DARK / LIGHT MODE
        ========================================================= */

        function applyTheme() {

            const theme =
                localStorage.getItem(
                    "jeffai-theme"
                ) || "light";

            const button =
                document.getElementById(
                    "themeButton"
                );

            if (theme === "dark") {

                document.body.classList.add(
                    "dark"
                );

                if (button) {
                    button.textContent = "☀️";
                    button.title =
                        "Switch to light mode";
                }

            } else {

                document.body.classList.remove(
                    "dark"
                );

                if (button) {
                    button.textContent = "🌙";
                    button.title =
                        "Switch to dark mode";
                }
            }
        }

        function toggleTheme() {

            const isDark =
                document.body.classList.contains(
                    "dark"
                );

            localStorage.setItem(
                "jeffai-theme",
                isDark
                    ? "light"
                    : "dark"
            );

            applyTheme();
        }

        /* =========================================================
           MOBILE SIDEBAR
        ========================================================= */

        function toggleSidebar() {

            document
                .getElementById("sidebar")
                .classList.toggle(
                    "open"
                );
        }

        function closeSidebar() {

            document
                .getElementById("sidebar")
                .classList.remove(
                    "open"
                );
        }

        /* =========================================================
           LOGOUT
        ========================================================= */

        async function logout() {

            await supabaseClient.auth.signOut();

            window.location.href =
                "/login.html";
        }

        /* =========================================================
           SCROLL
        ========================================================= */

        function scrollToBottom() {

            const chatArea =
                document.getElementById(
                    "chatArea"
                );

            setTimeout(
                () => {
                    chatArea.scrollTop =
                        chatArea.scrollHeight;
                },
                50
            );
        }

        /* =========================================================
           INITIALIZE
        ========================================================= */

        async function initialize() {

            applyTheme();

            await loadUser();

            await loadConversations();
        }

        initialize();
    </script>

</body>
</html>
